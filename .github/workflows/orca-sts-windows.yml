name: Orca-STS validation and Windows build

on:
  push:
    branches: [feat/elevenlabs-voice]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-sts-windows-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'kgr0831/orca' || github.repository == 'kgr0831/Orca-STS'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          cache-electron-package: 'true'

      - name: Install Electron package binary for tests
        run: node config/scripts/install-electron-package-binary.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version

      - uses: ./.github/actions/install-mobile-dependencies

      # The root unit suite uses the same Linux environment as upstream unit-tests.yml.
      - name: Check the change against the fork base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
        run: pnpm check:changed --base="$BASE_REF" --maxWorkers=4

  windows:
    if: github.repository == 'kgr0831/orca' || github.repository == 'kgr0831/Orca-STS'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Test voice modes and ElevenLabs contracts
        run: >-
          pnpm test src/shared/sts-work-modes.test.ts
          src/shared/sts-delegation.test.ts
          src/renderer/src/components/native-chat/use-native-chat-work-mode.test.tsx
          src/renderer/src/components/native-chat/NativeChatStructuredSession.availability-notice.test.tsx
          src/shared/sts-voice-playback.test.ts
          src/main/speech/elevenlabs-speech-client.test.ts
          src/main/speech/elevenlabs-transcription-session.test.ts
          src/main/startup/dev-instance-identity.test.ts
          src/main/updater.build-channel-selection.test.ts
          config/scripts/electron-builder-sts.test.mjs
          --maxWorkers=2

      - name: Typecheck the application
        run: pnpm typecheck

      - name: Build Windows application
        run: pnpm build:release

      - name: Package Orca-STS Windows installer
        run: |
          pnpm ensure:electron-runtime
          pnpm exec electron-builder --config config/electron-builder-sts.config.cjs --win --x64 --publish never

      - name: Record the source revision
        run: |
          git rev-parse HEAD > dist/ORCA-STS-SOURCE.txt
          cd dist
          sha256sum Orca-STS-*.exe > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: orca-sts-windows-${{ github.sha }}
          path: |
            dist/Orca-STS-*.exe
            dist/SHA256SUMS.txt
            dist/ORCA-STS-SOURCE.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
